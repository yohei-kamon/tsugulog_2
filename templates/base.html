<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TsuguLog | 製造技術承継</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #F3F2EF; font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #000000e6; }
        .navbar { border-bottom: 1px solid #e0e0e0; background-color: #fff !important; }
        .navbar-brand { color: #004182 !important; font-weight: 800; }
        .card { border: none; border-radius: 8px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08); margin-bottom: 12px; }
        .btn-primary { background-color: #004182; border: none; border-radius: 20px; font-weight: 600; padding: 6px 16px; }
        .btn-primary:hover { background-color: #003366; }
        .btn-warning { border-radius: 20px; font-weight: 600; color: #333; }
        .bg-industrial-blue { background-color: #004182; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fa-solid fa-microchip me-2"></i>TsuguLog</a>
            {% if current_user.is_authenticated %}
            <div class="d-flex align-items-center">
                <a href="{{ url_for('create_post') }}" class="btn btn-primary btn-sm me-3"><i class="fa-solid fa-plus me-1"></i> 技術を記録</a>
                <a href="{{ url_for('logout') }}" class="nav-link small text-muted">ログアウト</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
